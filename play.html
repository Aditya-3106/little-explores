<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Little Explorers - Child Playground</title>
  <link rel="manifest" href="./manifest.json">
  <!-- Tailwind CSS v4 — Production Build -->
  <link rel="stylesheet" href="./public/assets/styles.css">
  <style>
    @keyframes bounce-gentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-bounce-gentle { animation: bounce-gentle 2.5s infinite ease-in-out; }
    .animate-fade-in { animation: fade-in 0.3s ease-out; }
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-amber-50/60 via-orange-50/30 to-yellow-50/60 min-h-screen text-gray-800 antialiased font-sans flex flex-col">
  <!-- Top Navigation Header -->
  <header class="bg-white/90 backdrop-blur-md border-b border-amber-200/60 sticky top-0 z-40 px-4 py-3 flex items-center justify-between shadow-xs">
    <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.hash = '#/play'">
      <span class="text-3xl">🦊</span>
      <span class="text-xl font-black bg-gradient-to-r from-orange-600 to-amber-600 bg-clip-text text-transparent">Little Explorers</span>
    </div>

    <!-- Controls -->
    <div class="flex items-center gap-2">
      <!-- Language Toggle Switch -->
      <button id="lang-toggle-btn" class="px-3 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-full text-xs font-black shadow-xs flex items-center gap-1.5 transition-all min-h-[44px]">
        <span>🌐</span>
        <span id="lang-label">English</span>
      </button>

      <!-- Parent Studio Gate Button -->
      <a href="./parent.html#/parent" class="px-3.5 py-1.5 bg-purple-100 hover:bg-purple-200 text-purple-900 rounded-full text-xs font-black shadow-xs flex items-center gap-1.5 transition-all min-h-[44px]">
        <span>🔒</span>
        <span class="hidden sm:inline">Parent Area</span>
      </a>
    </div>
  </header>

  <!-- Main Child Learning Workspace Mount -->
  <main id="playground-app" class="flex-1 w-full max-w-4xl mx-auto p-4 md:p-6 pb-20">
    <!-- Router renders views dynamically here -->
    <div class="flex items-center justify-center p-12 text-amber-700 font-bold">
      <div class="animate-bounce-gentle text-4xl">🌟 Loading Little Explorers...</div>
    </div>
  </main>

  <script>
    // Language toggle handling
    const langBtn = document.getElementById('lang-toggle-btn');
    const langLabel = document.getElementById('lang-label');
    let current = localStorage.getItem('le_lang') || 'en';
    langLabel.textContent = current === 'mr' ? 'मराठी' : 'English';

    langBtn.addEventListener('click', () => {
      current = current === 'en' ? 'mr' : 'en';
      localStorage.setItem('le_lang', current);
      window.currentLang = current;
      langLabel.textContent = current === 'mr' ? 'मराठी' : 'English';
      window.location.reload();
    });
  </script>

  <!-- Application Bundle -->
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
