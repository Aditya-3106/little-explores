<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Explorers - Parent Studio</title>
  <!-- Tailwind CSS v4 — Production Build -->
  <link rel="stylesheet" href="./public/assets/styles.css">
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
    }
    .parent-nav-link.active {
      background-color: #eff6ff;
      color: #1d4ed8;
      font-weight: 800;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 antialiased font-sans flex flex-col pb-16 md:pb-0">
  <!-- Parent Studio Topbar -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-40 px-4 md:px-6 py-3 flex items-center justify-between shadow-xs">
    <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.hash = '#/parent/dashboard'">
      <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-black text-xl shadow-xs">
        LE
      </div>
      <div>
        <span class="text-base font-black text-gray-900 block leading-tight">Parent Studio</span>
        <span class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider">Content &amp; Activity Authoring</span>
      </div>
    </div>

    <!-- Quick Navigation Links (Desktop) -->
    <nav class="hidden md:flex items-center gap-1 text-xs font-bold text-gray-600" id="desktop-parent-nav">
      <a href="#/parent/dashboard" class="parent-nav-link px-3 py-1.5 rounded-lg hover:bg-gray-100 hover:text-gray-900">Dashboard</a>
      <a href="#/parent/create" class="parent-nav-link px-3 py-1.5 rounded-lg hover:bg-gray-100 hover:text-gray-900">Create</a>
      <a href="#/parent/questions" class="parent-nav-link px-3 py-1.5 rounded-lg hover:bg-gray-100 hover:text-gray-900">Questions</a>
      <a href="#/parent/collections" class="parent-nav-link px-3 py-1.5 rounded-lg hover:bg-gray-100 hover:text-gray-900">Collections</a>
      <a href="#/parent/progress" class="parent-nav-link px-3 py-1.5 rounded-lg hover:bg-gray-100 hover:text-gray-900">Progress</a>
      <a href="#/parent/profiles" class="parent-nav-link px-3 py-1.5 rounded-lg hover:bg-gray-100 hover:text-gray-900">Profiles</a>
      <a href="#/parent/import-export" class="parent-nav-link px-3 py-1.5 rounded-lg hover:bg-gray-100 hover:text-gray-900">Backup &amp; Restore</a>
    </nav>

    <!-- Return to Play & Lock -->
    <div class="flex items-center gap-2">
      <a href="./play.html#/play" class="px-3.5 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-xl text-xs font-bold shadow-xs flex items-center gap-1.5 min-h-[40px]">
        <span>👶</span>
        <span class="hidden sm:inline">Playground</span>
      </a>
      <button onclick="sessionStorage.removeItem('le_parent_unlocked'); window.location.hash = '#/parent';" class="p-2 text-gray-400 hover:text-gray-600 rounded-lg min-h-[40px]" title="Lock Parent Studio">
        🔒
      </button>
    </div>
  </header>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-gray-200 z-40 flex items-center justify-around py-2 px-1 shadow-lg text-[10px] font-bold text-gray-500" id="mobile-parent-nav">
    <a href="#/parent/dashboard" class="parent-nav-link flex flex-col items-center py-1 px-2 rounded-lg">
      <span class="text-lg">📊</span>
      <span>Home</span>
    </a>
    <a href="#/parent/create" class="parent-nav-link flex flex-col items-center py-1 px-2 rounded-lg text-blue-600 font-black">
      <span class="text-lg">➕</span>
      <span>Create</span>
    </a>
    <a href="#/parent/questions" class="parent-nav-link flex flex-col items-center py-1 px-2 rounded-lg">
      <span class="text-lg">📚</span>
      <span>Library</span>
    </a>
    <a href="#/parent/progress" class="parent-nav-link flex flex-col items-center py-1 px-2 rounded-lg">
      <span class="text-lg">📈</span>
      <span>Progress</span>
    </a>
    <a href="#/parent/import-export" class="parent-nav-link flex flex-col items-center py-1 px-2 rounded-lg">
      <span class="text-lg">📦</span>
      <span>Backup</span>
    </a>
  </nav>

  <!-- Parent Studio Main Mount Point -->
  <main id="parent-app" class="flex-1 w-full max-w-5xl mx-auto p-4 md:p-6 pb-20">
    <div class="p-8 text-center text-gray-400">Loading Parent Studio...</div>
  </main>

  <script>
    function updateActiveNav() {
      const hash = window.location.hash || '#/parent/dashboard';
      document.querySelectorAll('.parent-nav-link').forEach(link => {
        const href = link.getAttribute('href');
        if (hash.startsWith(href)) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }
    window.addEventListener('hashchange', updateActiveNav);
    window.addEventListener('DOMContentLoaded', updateActiveNav);
  </script>

  <!-- Application Bundle -->
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
